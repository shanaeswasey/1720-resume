<!DOCTYPE html>
<html lang="en"> <!-- Sets the page language to English -->

<head>
    <!-- Allows the page to display text and symbols correctly -->
    <meta charset="UTF-8">

    <!-- Makes the website fit different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the title shown on the browser tab -->
    <title>Shanae Swasey Resume | DWDD1720</title>

   
   
    <!-- STYLESHEETS -->

    <!-- Makes the website look consistent across browsers -->
    <link rel="stylesheet" href="styles/normalize.css">

    <!-- Loads the styles for small screens -->
    <link rel="stylesheet" href="styles/small.css">

    <!-- Loads the styles for medium-sized screens -->
    <link rel="stylesheet" href="styles/medium.css">

    <!-- Loads the styles for larger screens -->
    <link rel="stylesheet" href="styles/larger.css">

   
   
    <!-- GOOGLE FONT -->

    <!-- Connects the page to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Connects to the server that stores the font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Loads the Fira Sans font onto the page -->
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">


    <!--OPEN GRAPH TAGS--> <!-- Controls the title, description, and image shown when the website link is shared -->
    <!-- Sets the title shown when the website link is shared -->

    <!-- Sets the full URL for this webpage -->
    <meta property="og:url" content="https://shanaeswasey.github.io/1720-parks/">

    <!-- Tells social media that this is a website -->
    <meta property="og:type" content="website">

    <!-- Sets the title that appears when the page is shared -->
    <meta property="og:title" content="Shanae Swasey National Parks | DWDD1720">

    <!-- Sets the description that appears when the page is shared -->
    <meta property="og:description" content="Practice Page for Shanae Swasey's DWDD1720 National Parks Assignment.">

    <!-- Sets the image that appears when the page is shared -->
    <meta property="og:image" content="https://shanaeswasey.github.io/1720-parks/images/opengraph.jpg">

    <!-- Sets the logo used for the website -->
    <meta property="og:logo" content="https://shanaeswasey.github.io/1720-parks/images/logo.svg">

    <!-- Sets the name of the website -->
    <meta property="og:site_name" content="National Parks">



    <!--FAV ICON LINKS--> <!-- Connects the favicon images used in the browser tab and on devices -->
    <!-- Uses a 96x96 PNG image as a favicon -->
    <link rel="icon" type="image/png" href="/1720-parks/favicon-96x96.png" sizes="96x96" />

    <!-- Uses the SVG version of the favicon -->
    <link rel="icon" type="image/svg+xml" href="/1720-parks/favicon.svg" />

    <!-- Uses the standard favicon file -->
    <link rel="shortcut icon" href="/1720-parks/favicon.ico" />

    <!-- Sets the icon used when the website is saved to an Apple device -->
    <link rel="apple-touch-icon" sizes="180x180" href="/1720-parks/apple-touch-icon.png" />

    <!-- Sets the website name shown when saved to an Apple device -->
    <meta name="apple-mobile-web-app-title" content="USA National Parks" />

    <!-- Connects the file that stores extra favicon information -->
    <link rel="manifest" href="/1720-parks/site.webmanifest" />



    <!--SCRIPTS--> <!-- Connects the JavaScript files that make parts of the page work -->
    <!-- Makes the hamburger navigation menu open and close -->
    <script src="scripts/navigation.js" defer></script>

    <!-- Automatically puts the current year in the footer -->
    <script src="scripts/year.js" defer></script>

    <!-- Loads the JavaScript that builds the park cards -->
    <script src="scripts/parks.js" type="module"></script>



</head> <!-- Ends the section that holds the page settings and linked files -->

<body> <!-- Starts everything that will actually show on the webpage -->
    <header>
        <!-- Shows the logo at the top of the page -->
        <img src="images/logo.svg" alt="USA National Parks Logo" width="133" height="50">


        <!-- Creates the hamburger button used to open the navigation menu -->
        <button id="hamburger" class="hamburger" aria-label="Nav Link Button"></button>
    </header>

    <!-- Starts the navigation menu -->
    <nav id="navbar">
        <ul> <!-- Starts the list of navigation links -->
            <!-- Link to the Home Page -->
            <li><a href="#">Home</a></li>
            <!-- Shows the page is currently being viewed -->
            <li class="active"><a href="#">National Parks</a></li>
            <!-- Link to the Contact Page -->
            <li><a href="#">Contact</a></li>
        </ul> <!-- Ends the list of navigation links -->
    </nav> <!-- Ends the navigation menu -->


    <!-- Starts the main content area of the page -->
    <main>

        <h1>National Parks</h1>

        <!-- Holds all of the park cards that JavaScript creates -->
        <div id="allparks" class="allparks"></div>



    </main> <!-- Ends the main content area -->

    <!-- Starts the footer at the bottom of the page -->
    <footer>
        <!-- Holds the social media links -->
        <section class="social">

            <!-- Links to GitHub -->
            <a href="https://www.github.com" target="_blank"><img src="images/icon-github.svg" alt="GitHub Icon"
                    width="16" height="16"></a>

            <!-- Links to LinkedIn -->
            <a href="https://www.linkedin.com" target="_blank"><img src="images/icon-linkedin.svg" alt="LinkedIn Icon"
                    width="16" height="16"></a>

            <!-- Links to YouTube -->
            <a href="https://www.youtube.com" target="_blank"><img src="images/icon-youtube.svg" alt="Youtube Icon"
                    width="16" height="16"></a>

            <!-- Links to Facebook -->
            <a href="https://www.facebook.com" target="_blank"><img src="images/icon-facebook.svg" alt="Facebook Icon"
                    width="16" height="16"></a>
        </section> <!-- Ends the social media links -->

        <!-- Shows the current year, your name, and course name -->
        <p>&copy; <span id="currentyear"></span> &bull; Shanae Swasey &bull; DWDD1720</p>

    </footer><!-- Ends the footer -->
</body> <!-- Ends everything shown on the page -->

</html> <!-- Ends the entire HTML document -->
